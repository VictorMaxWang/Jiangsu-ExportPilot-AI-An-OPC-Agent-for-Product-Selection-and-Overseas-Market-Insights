map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=exportpilot_admin_api:10m rate=10r/m;

upstream exportpilot_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream exportpilot_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name opc.ankangyu.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name opc.ankangyu.cn;

    # HTTPS certificates should be configured by BT Panel or Tencent Cloud SSL.
    # Replace these placeholders on the server, and never commit private keys.
    ssl_certificate /www/server/panel/vhost/cert/opc.ankangyu.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/opc.ankangyu.cn/privkey.pem;

    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /health {
        proxy_pass http://exportpilot_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /api/admin/ {
        limit_req zone=exportpilot_admin_api burst=20 nodelay;
        proxy_pass http://exportpilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api {
        proxy_pass http://exportpilot_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /api/ {
        proxy_pass http://exportpilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://exportpilot_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/supin-deploy-test.db
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python -m pytest tests -q

  frontend-checks:
    name: frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        timeout-minutes: 8
        run: npm run build

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - backend-tests
      - frontend-checks
    env:
      TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
      TENCENT_PORT: ${{ secrets.TENCENT_PORT }}
      TENCENT_USER: ${{ secrets.TENCENT_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}

    steps:
      - name: Deploy on Tencent Cloud CVM
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          mkdir -p "$HOME/.ssh"
          key_file="$RUNNER_TEMP/tencent_deploy_key"
          trap 'rm -f "$key_file"' EXIT

          for required_secret in TENCENT_HOST TENCENT_PORT TENCENT_USER TENCENT_SSH_KEY; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Required secret $required_secret is not configured." >&2
              exit 1
            fi
          done

          printf '%s\n' "$TENCENT_SSH_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"

          ssh-keyscan -p "$TENCENT_PORT" "$TENCENT_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

          ssh \
            -i "$key_file" \
            -p "$TENCENT_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$TENCENT_USER@$TENCENT_HOST" \
            'bash -se' <<'REMOTE_DEPLOY'
          set -Eeuo pipefail

          cd /opt/supinzhihang
          git fetch origin
          git reset --hard origin/main
          sed -i 's/\r$//' scripts/*.sh
          chmod +x scripts/*.sh
          SKIP_BACKUP_BEFORE_MIGRATION=1 bash scripts/deploy_prod.sh

          curl -fsS http://127.0.0.1:8000/health
          curl -fsSI https://opc.ankangyu.cn \
            | sed -E '/^(Authorization|Cookie|Set-Cookie|WWW-Authenticate|Proxy-Authorization):/I d'

          smoke_response="$(mktemp)"
          trap 'rm -f "$smoke_response"' EXIT
          curl -fsS -X POST https://opc.ankangyu.cn/api/ai/smoke/text \
            -H 'Content-Type: application/json' \
            -d '{}' \
            -o "$smoke_response"
          grep -q '"success"[[:space:]]*:[[:space:]]*true' "$smoke_response"
          echo "AI smoke text check passed."
          REMOTE_DEPLOY
